# Phase 6, item 2. The problem being fixed: the only copy of a run's evidence
# lived in a terminal that stopped existing when the SSH session ended.
[Journal]
Storage=persistent
# ~3 MB/day at a 30s poll, so 512M is roughly half a year of headroom and
# cannot fill a 24 GB disk.
SystemMaxUse=512M
SystemKeepFree=1G
MaxRetentionSec=90day
# Rotate daily so `journalctl --since` has sensible boundaries to work with.
MaxFileSec=1day
